<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% csrf_token %}
    {% load static %}
    {% load render_bundle from webpack_loader %}

    <title>Mito-Ribosomal Protein Database</title>
    <style>
      html, body { margin: 0; padding: 0; background: #fbfafe; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f1b2e; }
      *, *::before, *::after { box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="app"></div>
    {% render_bundle 'main' %}
</body>
</html>
