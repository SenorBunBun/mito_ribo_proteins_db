<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% csrf_token %}
    {% load static %}
    {% load render_bundle from webpack_loader %}

    <title>Mito-Ribosomal Protein Database</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
      html, body { margin: 0; padding: 0; background: #fbfafe; }
      body {
        font-family: 'IBM Plex Sans', ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #1f1b2e;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      *, *::before, *::after { box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="app"></div>
    {% render_bundle 'main' %}
</body>
</html>
